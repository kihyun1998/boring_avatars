# Monthly pub update PRs for the package root and example/; npm and Actions are not watched.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: "increase-if-necessary"
    labels:
      - "needs-triage"

  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "monthly"
    labels:
      - "needs-triage"
    groups:
      example:
        patterns:
          - "*"
