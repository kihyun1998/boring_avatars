name: boring_avatars
description: "A bit-exact Dart port of boring-avatars. Same name in, same avatar out — with every upstream version selectable."
version: 0.3.2
repository: https://github.com/kihyun1998/boring_avatars
issue_tracker: https://github.com/kihyun1998/boring_avatars/issues

environment:
  # **No `flutter:` constraint, and that is checked rather than omitted.** The
  # newest Flutter API this package uses is `MediaQuery.devicePixelRatioOf`,
  # which first shipped in **3.10.0** (commit 73cb7c2fc5e, verified against the
  # SDK's own history) — far below whatever Flutter carries Dart 3.11.5, so the
  # Dart constraint already dominates and a Flutter line would be decoration.
  # Valid **as long as nothing newer than 3.10 is reached for**; the template's
  # `>=1.17.0` was removed in #42 for being a floor that was simply false.
  #
  # **Re-checked at #110**, which was the first change since to add framework
  # API rather than only arithmetic. It reaches for `LeafRenderObjectWidget`,
  # `RenderBox` (`computeDryLayout`, `hitTestSelf`), `PaintingContext`,
  # `Canvas.drawImageRect` and `ui.Image.clone` / `isCloneOf`. The two whose age
  # was not obvious were dated in the SDK's own history rather than recalled:
  # `RenderObject.dispose` arrived in #82883 (2021) and `Image.isCloneOf` in
  # engine#21371 (2020). Both predate 3.10, so the condition still holds and
  # `devicePixelRatioOf` is still the newest.
  #
  # **Re-checked again at #117**, which moved the placement off `localToGlobal`
  # and onto `RenderObject.getTransformTo` with `MatrixUtils.transformPoint` and
  # a `Matrix4` read. All three are older than the floor — `getTransformTo` and
  # `MatrixUtils` have been in `rendering`/`painting` since long before 3.10, and
  # `Matrix4` comes from `vector_math`, which Flutter re-exports. The list above
  # is edited rather than appended to: `localToGlobal` is no longer reached for
  # at all, and leaving it there would be a justification for an API this
  # package has stopped using.
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
