name: boring_avatars_example
description: "The boringavatars.com controls, drawn by this package's rasterizer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  boring_avatars:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs `integration_test/` on a **real engine** rather than the test binding,
  # which is the only way to check #110's placement claim on the backend that
  # will actually draw it. See that directory's header.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
